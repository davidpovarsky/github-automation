name: Central Live Activity Monitor

on:
  workflow_call:
    inputs:
      title:
        description: Optional Live Activity title. Defaults to caller repository name.
        required: false
        type: string
        default: ""
      symbol:
        description: SF Symbol used by Notify!
        required: false
        type: string
        default: "hammer.fill"
      tint:
        description: Notify! tint color.
        required: false
        type: string
        default: "#0A84FF"
      poll_seconds:
        description: Seconds between GitHub Actions status checks.
        required: false
        type: number
        default: 15
      keep_for:
        description: Seconds to leave the final Live Activity visible.
        required: false
        type: number
        default: 60
      max_minutes:
        description: Safety timeout for the monitor job.
        required: false
        type: number
        default: 360
      source_run_id:
        description: Workflow run ID to monitor. Zero means the current run.
        required: false
        type: number
        default: 0
      source_repository:
        description: owner/repo containing the workflow run. Defaults to the caller repo.
        required: false
        type: string
        default: ""
      source_branch:
        description: Branch of the source workflow run.
        required: false
        type: string
        default: ""
      source_workflow:
        description: Name of the source workflow.
        required: false
        type: string
        default: ""
      source_run_number:
        description: Human-readable source workflow run number.
        required: false
        type: number
        default: 0
    secrets:
      notify_device_id:
        required: false
      notify_device_token:
        required: false

permissions:
  actions: read
  contents: read

jobs:
  monitor:
    name: Live Activity monitor
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.max_minutes }}

    steps:
      - name: Checkout central automation
        uses: actions/checkout@v4
        with:
          repository: davidpovarsky/github-automation
          ref: main
          path: .github-automation
          persist-credentials: false

      - name: Check source run is still active
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          SOURCE_REPOSITORY: ${{ inputs.source_repository || github.repository }}
        shell: bash
        run: |
          if [ -z "$SOURCE_RUN_ID" ] || [ "$SOURCE_RUN_ID" = "0" ]; then
            echo "should_monitor=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          status="$(gh api "repos/$SOURCE_REPOSITORY/actions/runs/$SOURCE_RUN_ID" --jq '.status')"
          echo "Source run status: $status"
          if [ "$status" = "completed" ]; then
            echo "should_monitor=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_monitor=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Start Live Activity
        id: notify
        if: steps.gate.outputs.should_monitor == 'true'
        uses: davidpovarsky/github-automation@main
        with:
          action: start
          device_id: ${{ secrets.notify_device_id }}
          token: ${{ secrets.notify_device_token }}
          scope_repository: ${{ inputs.source_repository || github.repository }}
          scope_branch: ${{ inputs.source_branch || github.ref_name }}
          title: ${{ inputs.title || github.event.repository.name }}
          body: "${{ inputs.source_workflow || github.workflow }} #${{ inputs.source_run_number || github.run_number }}"
          symbol: ${{ inputs.symbol }}
          tint: ${{ inputs.tint }}
          progress: "0"
          status: "Starting"
          metrics_json: |
            [
              {"label":"Branch","value":"${{ inputs.source_branch || github.ref_name }}"},
              {"label":"Workflow","value":"${{ inputs.source_workflow || github.workflow }}"},
              {"label":"Run","value":"#${{ inputs.source_run_number || github.run_number }}"}
            ]

      - name: Follow workflow jobs
        id: follow
        if: steps.notify.outputs.activity_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          NOTIFY_DEVICE_ID: ${{ secrets.notify_device_id }}
          NOTIFY_DEVICE_TOKEN: ${{ secrets.notify_device_token }}
          NOTIFY_ACTIVITY_ID: ${{ steps.notify.outputs.activity_id }}
          POLL_SECONDS: ${{ inputs.poll_seconds }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          SOURCE_REPOSITORY: ${{ inputs.source_repository }}
          SOURCE_BRANCH: ${{ inputs.source_branch }}
          SOURCE_WORKFLOW: ${{ inputs.source_workflow }}
          SOURCE_RUN_NUMBER: ${{ inputs.source_run_number }}
        run: node .github-automation/scripts/monitor-run.js

      - name: End Live Activity
        if: always() && steps.notify.outputs.activity_id != ''
        uses: davidpovarsky/github-automation@main
        with:
          action: end
          device_id: ${{ secrets.notify_device_id }}
          token: ${{ secrets.notify_device_token }}
          activity_id: ${{ steps.notify.outputs.activity_id }}
          scope_repository: ${{ inputs.source_repository || github.repository }}
          scope_branch: ${{ inputs.source_branch || github.ref_name }}
          progress: "100"
          status: ${{ steps.follow.outputs.final_status || 'Finished' }}
          keep_for: ${{ inputs.keep_for }}
