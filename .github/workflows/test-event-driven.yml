name: Validate event-driven Live Activity implementation

on:
  push:
    paths:
      - worker/**
      - live-refresh/**
      - scripts/instrument-workflows.js
      - test/**
      - package.json
      - package-lock.json
      - wrangler.toml
      - .github/workflows/test-event-driven.yml
  pull_request:
    paths:
      - worker/**
      - live-refresh/**
      - scripts/instrument-workflows.js
      - test/**
      - package.json
      - package-lock.json
      - wrangler.toml
      - .github/workflows/test-event-driven.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check
