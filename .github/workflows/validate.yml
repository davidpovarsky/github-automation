name: Validate action

on:
  push:
    paths:
      - action.yml
      - index.js
      - .github/workflows/validate.yml
  pull_request:
    paths:
      - action.yml
      - index.js
      - .github/workflows/validate.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  syntax:
    name: Syntax, metadata, and runtime
    runs-on: ubuntu-latest
    steps:
      - name: Live Activity · refresh
        uses: davidpovarsky/github-automation/live-refresh@main
        continue-on-error: true
        with:
          event: refresh
          device_id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_DEVICE_TOKEN }}
          github_token: ${{ github.token }}
      - uses: actions/checkout@v4

      - name: Live Activity · refresh
        uses: davidpovarsky/github-automation/live-refresh@main
        continue-on-error: true
        with:
          event: refresh
          device_id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_DEVICE_TOKEN }}
          github_token: ${{ github.token }}
      - name: Check JavaScript syntax
        run: |
          node --check index.js
          node --check scripts/monitor-run.js
          node --check scripts/account-monitor.js

      - name: Live Activity · refresh
        uses: davidpovarsky/github-automation/live-refresh@main
        continue-on-error: true
        with:
          event: refresh
          device_id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_DEVICE_TOKEN }}
          github_token: ${{ github.token }}
      - name: Verify action metadata
        shell: python
        run: |
          from pathlib import Path

          text = Path("action.yml").read_text(encoding="utf-8")
          required = [
              "name: Notify Live Activity",
              "using: node24",
              "main: index.js",
              "activity_id:",
              "metrics_json:",
              "fail_on_error:",
          ]

          missing = [item for item in required if item not in text]
          if missing:
              raise SystemExit(f"Missing required action.yml entries: {missing}")

          print("action.yml basic validation passed")

      - name: Live Activity · refresh
        uses: davidpovarsky/github-automation/live-refresh@main
        continue-on-error: true
        with:
          event: refresh
          device_id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_DEVICE_TOKEN }}
          github_token: ${{ github.token }}
      - name: Exercise action without credentials
        id: smoke
        uses: ./
        with:
          action: start
          device_id: ""
          token: ""
          title: "Validation smoke test"

      - name: Live Activity · refresh
        uses: davidpovarsky/github-automation/live-refresh@main
        continue-on-error: true
        with:
          event: refresh
          device_id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_DEVICE_TOKEN }}
          github_token: ${{ github.token }}
      - name: Verify safe skip behavior
        shell: bash
        run: |
          test "${{ steps.smoke.outputs.state }}" = "skipped"
          echo "Runtime smoke test passed"
