name: Live Activity · refresh
description: Send a fail-open, identifier-only Live Activity refresh to the central Worker.
author: davidpovarsky
branding:
  icon: activity
  color: blue
inputs:
  event:
    description: Refresh hint; use final-hint for an accelerated completion check.
    required: false
    default: refresh
  endpoint:
    description: Central Worker refresh endpoint. Leave empty until deployment is configured.
    required: false
    default: ''
runs:
  using: node24
  main: index.js
